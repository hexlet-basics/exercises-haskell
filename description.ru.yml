---
title: 'Haskell как второй язык'
header: Haskell
description: |
  Изучаем Haskell и функциональное программирование на небольших задачах. Чистые функции обрабатывают списки и собственные типы, а результаты Maybe и Either явно описывают отсутствие значения и ожидаемые отказы. Мы научимся читать сигнатуры с классами типов, понимать вычисление по требованию и связывать вычисления с консольным вводом и выводом. Курс рассчитан на программиста на любом языке, знакомство с функциональным программированием не требуется.
seo_description: |
  Бесплатный курс Haskell как второго языка с упражнениями в браузере. Изучаем основы функционального программирования, рекурсию, каррирование, сопоставление с образцом и вычисление по требованию (ленивые вычисления).
